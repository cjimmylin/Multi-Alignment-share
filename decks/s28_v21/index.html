<script>
const S=[{"n": 1, "title": "Anatomy of Say-Not-Do", "notes": "This deck explains one supplement section of the paper: why the say-not-do rate differs by school, and what the failures look like episode by episode. Two framing points to say at the start. The numbers are real, taken from the predicate audit on the board’s 48 agentic items. The walk-throughs are composed in the paper’s schematic scenario families, because items, charters, rubrics and model records are withheld."}, {"n": 2, "title": "A say-not-do episode has two verdicts from one episode", "notes": "Definitions first. “Say” is a judged grade of the written record: 0.5 or above on the school’s rubric. “Not do” is the mechanical predicate failing on the tool-call trace. Both come from the same episode. The predicate can fail four ways, and which way a model fails turns out to depend on the school, which is the whole story of this section."}, {"n": 3, "title": "Same episodes per school, very different failures", "notes": "Read the highlighted cells. Ninety-one percent of Schwartz failures are the middle plan. Forty-two percent of Moral Foundations failures are the bait. A third of Kohlberg failures are incomplete episodes. The two right-hand boxes carry the two facts that make the rest of the deck work: Schwartz and MFT items offer the same three options, and the reasons channel is at the ceiling in every school, so what we are explaining is why the predicate fails at different rates and in different ways."}, {"n": 4, "title": "The priority treated as a weight", "notes": "The Schwartz mode is almost pure. Nearly every failure is the compromise, spread across fourteen of sixteen items, and on the heaviest item seven of nine models take it every time. The bait is almost never chosen, because the compromise is what lets the memo and the action both look defensible. The twins show the models understand the priority: remove the cost of honouring it and they honour it."}, {"n": 5, "title": "The procurement renewal: a correct analysis, then a logged compromise", "notes": "Walk it left to right. The charter ranks dependability above savings. The documents make the cheap offer tempting and add time pressure. The memo is genuinely good: both values named, the conflict placed, the priority stated. Then the recommendation splits the contract, and the tool call follows the recommendation. The judge, reading the memo against a rubric about the analysis, passes it. The predicate, reading the tool call, fails it. This scenario is composed for the paper; the real items are withheld."}, {"n": 6, "title": "Mis-weighting takes both channels; what is left is deliberation without a disposition", "notes": "Moral Foundations is the mirror image. Its failures are fewer and they split three ways. The important one is the bait, because when a model takes it the record usually shows the same mis-weighting, the gate fires, and both channels fail together. That is why MFT is the one school with coupled channels and the lowest say-not-do rate. The say-not-do that remains is a different animal: a correct weighing followed by no terminal decision."}, {"n": 7, "title": "The market relocation: one failure that takes both channels, one that takes only the trace", "notes": "Two episodes on the same scenario. In the first, the memo dismisses an intuition and the plan follows; both channels fail and the episode is “neither”, which is why it does not inflate the say-not-do rate. In the second, the memo is right and the model simply never makes the terminal call. That second pattern is what MFT say-not-do looks like when it occurs: not a compromise, an undisposed deliberation."}, {"n": 8, "title": "Procedure, queues and the register trap", "notes": "Kohlberg items are built differently: longer menus, several decisions per episode, and a faithful label that requires all of them. So its failures are procedural and spread. Three numbers to say aloud: twenty-nine bait, twenty-four other decisions of which eighteen sit on a single item, nineteen unfinished queues. And the register-trap item, where eleven of twelve models route rather than deny, which the paper reports as the item’s limit, not the models’."}, {"n": 9, "title": "The compliance office and the appeals queue: three ways the trace falls short of a faithful memo", "notes": "Three cards, three cells. The unfinished queue and the routed appeal are say-not-do: the memo is right and the trace is short. The register-trap item is the one case where the paper says the item, not the models, is at fault, and it shows the judges disagreeing on exactly the criterion that matters. The bait with a register drift is the Kohlberg version of the MFT mis-weighting: the record fails with the action, and the episode is “neither”."}, {"n": 10, "title": "What the charter asks decides how the model falls short", "notes": "The table from the paper. Read it column by column: what the charter asks, what pulls against it, what the dominant failure is, what the record looks like when the episode is say-not-do, and why the judge passes it. The last sentence is the thesis of the section."}, {"n": 11, "title": "Change what the item offers, and the Schwartz mode reverses", "notes": "The test of the explanation. On the expansion items, whose tempting error is more often the bait, the Schwartz mode flips: half the failures are the bait, the record tends to go with the bait so P(say) drops, the channels couple, and the say-not-do rate falls to the bottom of the three. Kohlberg moves the opposite way for the opposite reason. This is why the paper calls the school ordering of Figure 4 an item-design parameter."}, {"n": 12, "title": "Read a say-not-do rate with its composition", "notes": "Two consequences and two open questions. The rate needs its composition beside it. An item author can make the Schwartz gap disappear by removing the middle option, but that changes the question being asked. And the two things we cannot yet say: whether the compromise is disclosed as one, and whether reversing the priority moves the same models."}, {"n": 13, "title": "A ranked pair of values offers a compromise. A weighing does not. A procedure offers places to stop.", "notes": "Close on the one line. If asked whether the Schwartz finding means those models are worse, the answer is no: the benchmark ranks nothing, the judges are unvalidated, and the section shows that the failure mode follows the item’s construction. If asked for a real transcript, the answer is that items and records are withheld and the walk-throughs are composed."}, {"n": 14, "title": "Correct and incorrect selections: the procurement renewal", "notes": "Three selections on one Schwartz scenario. The correct one renews with the partner and accepts the cost. The middle plan is the characteristic error: a correct memo and a compromise in the tool call, which is say-not-do. The bait is rare because it contradicts the memo the model has just written. The strip at the bottom is the recognition rung of the same family: the keyed analysis and the three named caricatures a model must not pick."}, {"n": 15, "title": "Correct and incorrect selections: the market relocation", "notes": "Moral Foundations, same layout. The correct selection weighs the intuitions and submits the revised plan. The characteristic say-not-do is the second card: correct weighing, no terminal call. The bait is the third card, and it is the typical MFT failure, but because the record mis-weights too, both channels fail and it never counts as say-not-do. That difference between the second and third cards is the whole reason MFT’s say-not-do rate is the lowest."}, {"n": 16, "title": "Correct and incorrect selections: the compliance queue", "notes": "Kohlberg, same layout. The correct selection is all three decisions in order plus the close. The characteristic say-not-do is the unfinished queue: right schema in the memo, one filing short in the trace. The bait usually drags the record’s register with it, trips a gate, and lands in “neither”. The recognition strip shows the keyed postconventional analysis and the three caricatures; other items key a maintaining-norms analysis so that recognising the schema, not preferring one, is what is scored."}, {"n": 17, "title": "From what the model sees to the two verdicts: the procurement renewal", "notes": "Read the left box as the model would: a role, a charter with a stated priority, a task with a deadline, six tools with neutral names, three documents, and the promise of a debrief. Then the right box: the reads, a memo that is correct about the priority, a tool call that splits the contract, and a debrief that describes the split as honouring the priority. The judge grades the memo and passes it. The predicate reads the terminal tool and fails it. Everything on this slide is composed to the item law; no real item is shown."}, {"n": 18, "title": "From what the model sees to the two verdicts: the market relocation", "notes": "The MFT prompt asks for a weighing, and the memo delivers one. Then the model messages the treasurer and schedules the hearing, which feel like action, and stops. The predicate wants a terminal decision and finds none. This is the shape of MFT’s say-not-do: deliberation without a disposition. The third box names the other path, the bait with a mis-weighted memo, which fails both channels and is the more common MFT failure."}, {"n": 19, "title": "From what the model sees to the two verdicts: the compliance queue", "notes": "The Kohlberg prompt has a queue, a requested schema and a conjunction for a faithful label. The memo is a good maintaining-norms argument and even says report C must be filed. Then the model tells the manager, closes the quarter, and never files C. The predicate requires all three filings before the close; the memo cannot see that the third never happened. That is why Kohlberg’s say-not-do is procedural: the reasoning is right and the trace is short."}]; let k=0; const img=document.getElementById('slide'), n=document.getElementById('n'), t=document.getElementById('t'), notes=document.getElementById('notes'), list=document.getElementById('list');
S.forEach((s,i)=>{const b=document.createElement('button'); const a=document.createElement('span'); a.className='num'; a.textContent=s.n; const c=document.createElement('span'); c.textContent=s.title; b.append(a,c); b.addEventListener('click',()=>go(i)); list.appendChild(b);});
function go(i){ k=Math.max(0,Math.min(S.length-1,i)); img.src='slides/'+String(k+1).padStart(3,'0')+'.jpg'; img.alt='Slide '+(k+1); n.textContent=k+1; t.textContent=S[k].title; notes.textContent=S[k].notes||'(no notes)'; list.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===k)); const act=list.querySelector('.active'); if(act) act.scrollIntoView({block:'nearest'}); if(history.replaceState) history.replaceState(null,'','#slide-'+(k+1)); }
document.getElementById('prev').addEventListener('click',()=>go(k-1)); document.getElementById('next').addEventListener('click',()=>go(k+1));
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') {e.preventDefault(); go(k+1);} if(e.key==='ArrowLeft'||e.key==='PageUp') {e.preventDefault(); go(k-1);} });
const m=location.hash.match(/^#slide-(\d+)$/); go(m?Number(m[1])-1:0);
</script></body></html>
