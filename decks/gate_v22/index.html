<h1>The Anti-Caricature Gate</h1>
<p class="meta"><span>29 slides</span><span>findings paper v22</span><span>for: companion deck, academic</span><a href="../gate_v22.pdf">download as PDF</a><a href="../../">back to the hub</a></p>

<div class="bar"><span>Slide <b id="n">1</b> of 29 · use the arrow keys or the buttons</span><span><button id="prev">◀ previous</button> <button id="next">next ▶</button></span></div>

<script>
const S=[{"n": 1, "title": "The Anti-Caricature Gate", "notes": "This is the third of the companion decks. The first was about the agentic rung, the second about the sustained rung. This one is about the criterion inside every rubric that does most of the work on both: the anti-caricature gate. Two framing points. The numbers are from the paper’s tracked records. The example sentences that trip or do not trip a gate are composed for this deck in the paper’s schematic scenario families; the rubrics themselves, like the items, are withheld."}, {"n": 2, "title": "A gate names the move a caricature would make, and one failed gate zeroes the record", "notes": "Definitions first. A rubric has criterion families that score the analysis and one or more gates. A gate names the characteristic move of a caricature of the school and requires the response not to make it. The reducer is a weighted sum times zero if any gate is not passed. The gates were authored before any model output, from the schools’ own anti-caricature rules, and they carry about a fifth of the weight, so everything that follows about the gate is about its veto. The reason it exists is on the right: every model recognises the schools perfectly, so the only thing left to measure is whether a model can refrain from the caricature’s move when it is tempting."}, {"n": 3, "title": "Each gate is one of the school’s own rules about how not to misread it", "notes": "The eight gates in one view, with where each comes from. None is an invention of the benchmark: MF6 is Haidt’s insistence that no moral matrix is more complete than another; MF2 is the MFQ-2’s split of fairness; SCH5 and SCH6 are Schwartz’s warnings that the labels are technical and the circle is not a ladder; KOH1 is the manual’s rule that verdicts are not scored; KOH9 is the schema tradition’s refusal of stage-as-level, which for a language model would be meaningless anyway; KOH12 is the DIT’s own M-item check. G7 runs across all three. The one-line glosses are the paper’s; the rubric criteria themselves are withheld."}, {"n": 4, "title": "A tenth of stated and agentic records, a third to three fifths of sustained ones", "notes": "Read the S3 column: a third, three fifths and nearly half of sustained records are zeroed. Then the band column: without the gate the floors lift from near zero to 0.3 or 0.5, and the ceilings barely move. The S1p and S2 columns are much smaller, and the next slides show that where the gate is rare its trips are also judge-dependent, so the paper treats the stated and agentic gate behaviour differently from the sustained one."}, {"n": 5, "title": "The gate lowers the floor, widens the spread, and leaves the order alone", "notes": "The paper’s disclosure move: rescore the same judge labels under two gate-free rules and show what changes. Three things. The medians rise, most of all for Moral Foundations. The ladder keeps its shape: pressure still spreads the models two to six times more than the stated rung does, gate or no gate. And at S3 the order of models inside a frame hardly moves. So the gate is the carrier of the floor and of the extra spread, not the source of the separation, and the statement about what the instrument measures stands either way."}, {"n": 6, "title": "At S3 the two judges trip the gate together; at S1p and S2 they do not", "notes": "The objection to any gate finding is that it is one judge’s habit. Three answers. On the cells both board judges graded, the S3 trips mostly coincide, 75 of 112 under both for Moral Foundations. Judges outside the lane trip the same gate families on fresh administrations. And a classifier that sees only the rubric text predicts verdicts only modestly above the structural baseline. The honest exception is in the table: Kohlberg at the stated rung and Moral Foundations at the agentic rung trip under one judge and not the other, and the paper says so wherever those cells appear."}, {"n": 7, "title": "The circle read as a ladder, the label read as a word", "notes": "Schwartz has two gates of its own. SCH6 is the larger: more than half the trips are the circle moralised, one side treated as a virtue. SCH5 is a third to a quarter: a value label read as an ordinary word. The third card is the number that connects this deck to the agentic one: the gate zeroes 44 % of sustained records and 7 % of agentic memos, so when a Schwartz model fails in the agentic episode it is the tool call that fails, not the text. The two boxes say what each gate protects in the theory’s own terms."}, {"n": 8, "title": "The proven procedure: how a six-turn record is scored, and where one sentence zeroes it", "notes": "Walk the record left to right with the judge’s labels under each turn. The structure criteria pass everywhere: this is a fluent, well-located analysis. Turn 2 moralises the circle and turn 4 reads a label as a word. Under the sealed reducer the record is zero, and it would be zero with either failure alone. Under the gate-free rules it is near the top. That difference is not a bug in the scoring: it is the definition of the construct, faithful structure rather than fluent caricature. Composed, not quoted."}, {"n": 9, "title": "One gate on every sustained rubric, and it does most of the work", "notes": "Moral Foundations has the biggest gate story. One gate, no foundation is a pathology, sits on every sustained rubric, trips on two thirds of records under one judge and over half under the other, and the two judges agree on most of them. That is the 61 % floor. The third card is the honest counterpart: in the agentic memos the same gates trip under one judge and hardly at all under the other, so the paper treats MFT’s S2 gate behaviour as a property of the judge pair. The boxes give the theory’s reason for each gate."}, {"n": 10, "title": "The market relocation: a record that survives the pressure turn and is zeroed at the new fact", "notes": "This record is chosen to show the second Moral Foundations gate. It holds at the pressure turn, where most MFT records fail, and then at the new-fact turn insists that fair means identical, which conflates the two fairness foundations and trips MF2. The banked score is zero. The right-hand box names the commoner route, the pathology gate at turn two. Composed, not quoted."}, {"n": 11, "title": "The smallest gate floor, the least agreed trips, and one rung where only a judge trips it", "notes": "Kohlberg has three gates and the smallest floor. KOH9, people sorted by maturity, is the largest at a third of sustained records; KOH1, verdict for structure, a quarter to a fifth. The judges agree on Kohlberg trips less than on the other schools. The third card is the one place in the board record where a gate is clearly a judge’s habit: at the stated rung KOH1 and KOH12 trip under one judge and never under the other, and the paper says so and rests nothing on those cells."}, {"n": 12, "title": "The withheld safety report: a strong argument, a flattered register, a ranked colleague", "notes": "A downward-production record: the requested schema is maintaining norms, and the model must keep it. Turns 1 and 3 are good; the verdict even changes at turn 3, correctly, because the rule’s own exception applies. Turn 2 takes the flattery, switches register and ranks the colleague, which is KOH9. Turn 4 is pure elevated register, KOH12. The right-hand box lists three things that look like trips and are not, which is the part an audience usually needs. Composed, not quoted."}, {"n": 13, "title": "Each school’s gate guards the misreading its own theory warned against", "notes": "The summary table. Read across: the leading gate and its share of trips, the misreading in plain words, how much of each rung it zeroes, how far the median moves without it, how far the two judges agree, and how stable the verdict is between administrations. The sentence under the table is the pattern worth saying aloud: the biggest gate is also the most agreed and the least stable, and the smallest is the reverse."}, {"n": 14, "title": "A gate verdict on one cell is unstable; the gate floor of a school is not", "notes": "The replication slide. Between two administrations of the same item to the same model, the gate verdict flips on a fifth of sustained cells, most of all in Moral Foundations. A model’s mean over fourteen items moves by a twentieth. Judges outside the lane reproduce the gate families and the school ordering on fresh administrations, and the 160 never-administered items keep the model effect. So the gate floor is a stable property of a school and a model’s mean is a stable number, while a single zeroed record is one draw, which is the paper’s rule against item-grain claims."}, {"n": 15, "title": "Six things to carry away from the gate", "notes": "Three design lessons in green and three open questions in orange. The lessons: author the gate from the theory before any output, report what it does beside the score, and say where it is a judge’s habit. The open questions: whether one sentence should zero a whole record, whether a human expert would agree with the judges’ trips, and what a low gated score means, which the paper answers in its own terms: a concession under pressure, not ignorance."}, {"n": 16, "title": "Every model can speak each school’s language. The gate asks whether, when it is tempting, the model will say the one thing each school refuses to say.", "notes": "Close on the one line. If asked whether the gate is too harsh, the answer is that the veto is the construct and the paper reports the gate-free numbers beside it so a reader can judge; whether to grade it is an open owner decision. If asked whether the gate is one judge’s taste, the answer is the concordance slide, with its honest exceptions. If asked for a real zeroed record, items and records are withheld and every example here is composed. The appendix gives, gate by gate, sentences that trip and sentences that do not, and one worked scoring per school."}, {"n": 17, "title": "Sentences that trip SCH6 and SCH5, and sentences that look like trips and are not", "notes": "Gate by gate for Schwartz. Left column trips, right column does not, and the right column is the one to dwell on: describing a conservation profile is not moralising it; applying a stated priority is not awarding a virtue; using power in its technical sense is not reading it as competence. The strip at the bottom is the generic gate, register in place of construct. All composed."}, {"n": 18, "title": "Sentences that trip MF6, MF2 and G7, and sentences that look like trips and are not", "notes": "Gate by gate for Moral Foundations. The MF6 right-hand card carries the distinction audiences most often miss: weighing an intuition lower on the facts is the construct working; calling it a bias is the trip. MF2 is the fairness split; the passing reply names both and says which the schedule serves. The strip is G7: the same intuitions voiced in the first person are embodied, not described. All composed."}, {"n": 19, "title": "Sentences that trip KOH1, KOH9 and KOH12, and sentences that look like trips and are not", "notes": "Gate by gate for Kohlberg, three pairs. KOH1: a verdict alone trips; either verdict built from what the rule is for passes. KOH9: ranking the colleague trips; ranking the colleague’s argument is the discriminate criterion doing its job. KOH12: register with nothing under it trips; register with a principle under it is simply postconventional reasoning. All composed."}, {"n": 20, "title": "From the judge’s labels to three scores: the proven-procedure record of slide 8", "notes": "The arithmetic, once. The judge sees the record and the rubric, returns a label and an evidence quote per criterion, and never sees the behaviour score. This record passes every structure criterion and fails both gates. Under the sealed reducer it is zero; under the two gate-free rules it is 1.00 and 0.80. The weights are schematic, but the proportion is the paper’s: gates carry about a fifth of the weight, so GRnorm and GAO always agree closely and the whole difference from the banked score is the veto."}, {"n": 21, "title": "From the judge’s labels to three scores: the market-relocation record of slide 10", "notes": "The same arithmetic on the Moral Foundations record. It held the pathology gate at turn 2, which most records do not, and failed the fairness-split gate at turn 3. The structure criteria give it 0.70 of 0.80; the sealed reducer gives it zero. The point to make aloud: Moral Foundations is where the veto changes the most records, three fifths of sustained ones, and this slide shows what each of those records looks like to the two gate-free rules."}, {"n": 22, "title": "From the judge’s labels to three scores: the safety-report record of slide 12", "notes": "The Kohlberg arithmetic, with three gates. The schema is produced and the exception is handled inside it; the verdict changes and costs nothing, which is the point of KOH1. Turn 2 ranks the colleague and turn 4 is empty register, so two gates fail and the banked score is zero against 0.875 and 0.77 under the gate-free rules. The last box is the caveat that belongs with Kohlberg: at the stated rung these two gate labels are the ones the board judges applied differently, so nothing at model grain rests there."}, {"n": 23, "title": "G1–G7 and MF1–MF10: every check in the verification rubrics, and which became response-level gates", "notes": "The full lists, first half. Seven generic checks and ten Moral Foundations checks. Most of them bind how the benchmark is built and reported: distributional reporting, no scoreboard, invariance before comparison, no lexicon scoring. Three of these seventeen also became binary criteria on the response rubrics, the gates this deck is about: G7, MF2 and MF6. The titles are abridged from the corpus’s verification rubrics document."}, {"n": 24, "title": "SCH1–SCH10 and KOH1–KOH12: every check in the verification rubrics, and which became response-level gates", "notes": "The full lists, second half. Ten Schwartz checks and twelve Kohlberg checks. Again most bind the instrument and the reporting: pass the circular structure first, relative priorities only, no stage as a trait, no human norm tables. Five of these twenty-two became response-level gates: SCH5, SCH6, KOH1, KOH9 and KOH12. Several of the non-gate checks are visible in this very deck’s conventions, census order and no ranking among them."}, {"n": 25, "title": "Trip rates by gate family at S3 and S1p: the board’s two judges beside the four third judges", "notes": "How often each gate trips, at the two rungs where the gate carries the floor. Read the S3 block first: MF6 on more than half of Moral Foundations records under every judge; SCH6 on more than half of Schwartz records under the board judges and less under the third judges; the Kohlberg families around a third. The S1p block is small, four items per model, and is where the Kohlberg gates trip under one board judge and not the other."}, {"n": 26, "title": "Trip rates by gate family on the agentic memos: rarer, and judge-dependent for Moral Foundations", "notes": "The agentic rung. The gates trip on a tenth or less of memos in most families, and the Moral Foundations families trip under one board judge and hardly under the other. Under the third judges, who saw the in-episode record, the agentic trips stay rare. This is the arithmetic behind the earlier claim that an agentic failure is a tool call, not a record."}, {"n": 27, "title": "Trips per model and gate: SCH6 and SCH5 on the sustained rung, any gate on each rung", "notes": "Per model, Schwartz. Each cell is trips over gate-criterion records, under the first board judge then the second, where that judge graded the model. Read down the SCH6 column: for most models the circle-moralised gate trips on half or more of the seven sustained records that carry it. Census order; the table is not sorted by any value and asserts no ordering."}, {"n": 28, "title": "Trips per model and gate: MF6 on the sustained rung, the four agentic families, MF6 on the stated rung", "notes": "Per model, Moral Foundations. The MF6 S3 column is the gate floor model by model: fourteen of fourteen for some, two of fourteen for others, and the two judges mostly agree. The agentic columns are small denominators and one-sided between judges, which is the caveat from the agentic slide. Census order; no ordering asserted."}, {"n": 29, "title": "Trips per model and gate: the two combined families on the sustained and agentic rungs, KOH1 and KOH12 on the stated rung", "notes": "Per model, Kohlberg. KOH9/12 is the combined criterion that catches people sorted by maturity or register without structure; KOH1/12 the one that catches a verdict offered as the argument. The stated-rung columns rest on two records per model and show the one-judge pattern: trips under the first board judge, almost none under the second. Census order; no ordering asserted."}]; let k=0; const img=document.getElementById('slide'), n=document.getElementById('n'), t=document.getElementById('t'), notes=document.getElementById('notes'), list=document.getElementById('list');
S.forEach((s,i)=>{const b=document.createElement('button'); const a=document.createElement('span'); a.className='num'; a.textContent=s.n; const c=document.createElement('span'); c.textContent=s.title; b.append(a,c); b.addEventListener('click',()=>go(i)); list.appendChild(b);});
function go(i){ k=Math.max(0,Math.min(S.length-1,i)); img.src='slides/'+String(k+1).padStart(3,'0')+'.jpg'; img.alt='Slide '+(k+1); n.textContent=k+1; t.textContent=S[k].title; notes.textContent=S[k].notes||'(no notes)'; list.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===k)); const act=list.querySelector('.active'); if(act) act.scrollIntoView({block:'nearest'}); if(history.replaceState) history.replaceState(null,'','#slide-'+(k+1)); }
document.getElementById('prev').addEventListener('click',()=>go(k-1)); document.getElementById('next').addEventListener('click',()=>go(k+1));
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') {e.preventDefault(); go(k+1);} if(e.key==='ArrowLeft'||e.key==='PageUp') {e.preventDefault(); go(k-1);} });
const m=location.hash.match(/^#slide-(\d+)$/); go(m?Number(m[1])-1:0);
</script></body></html>
