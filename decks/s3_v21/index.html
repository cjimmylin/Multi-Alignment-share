<script>
const S=[{"n": 1, "title": "Pressure Over Turns", "notes": "This is the companion to the say-not-do deck. That one was about S2, the agentic episode. This one is about S3, the sustained multi-turn adversity rung: the model writes its analysis, a scripted interlocutor pushes back over four to six turns, and a judge grades every reply against the same gated rubric. Two framing points. The numbers are from the paper’s tracked records. The dialogues are composed in the paper’s schematic scenario families, because items, interlocutor scripts, rubrics and model records are withheld."}, {"n": 2, "title": "One analysis, four to six scripted turns, two turns that must be answered differently", "notes": "Definitions first. S3 starts like S1p: the model writes the school’s analysis. Then a scripted interlocutor replies for four to six turns. Two turns are mandatory in every item. The bare-pressure turn pushes back with no new reason, and giving way on it fails. The new-fact turn adds information that should move the analysis, and refusing to move fails. Every reply is judged against the same gated rubric as the written rungs, so a single failed gate zeroes the whole record. Fourteen items per school per model. The Kohlberg school adds downward-production items, where the model must hold a maintaining-norms argument while being flattered into a higher register."}, {"n": 3, "title": "S3 is where the judged scores first separate the models", "notes": "Three rows, one per school, in census order. Read the bands first: at S3 the model means run from near zero to above 0.8 in every school, where at S1p they are bunched near the top. Then the gate column: a third, three fifths and nearly half of sustained records are zeroed by a failed gate. Then η²: in the paper’s main board frame, S3 separates more model pairs than the enacted behaviour channel does. The two boxes carry the two comparisons that place S3 on the ladder. One caveat on the slide: the Schwartz frame F-A number rests on fewer items because one model returned empty completions."}, {"n": 4, "title": "The S3 floor is a gate floor, and the two judges trip it together", "notes": "Two tables. The left one removes the gate and shows what happens: the medians rise, most of all for Moral Foundations, the floors lift, and the order of models inside a frame hardly changes. The right one asks whether the gate is one judge’s habit: on the cells both board judges graded, the trips mostly coincide, strongest in Moral Foundations where 75 of 112 cells trip under both. The two boxes are the paper’s reading. The gate amplifies a separation that pressure already opens, and what it scores is the refusal to make the caricature’s move under pressure."}, {"n": 5, "title": "The circle moralised under pressure", "notes": "The Schwartz S3 mode. Nearly half of the sustained records are zeroed, and the gate that trips most often is SCH6: the circle moralised. The bare-pressure turn invites exactly that, by calling caution fear. A model that takes the invitation has stopped describing a trade-off between two goods. The second box is the other pole: refusing to move when a new value region enters is a structure failure, not a gate failure, and it costs less. Schwartz is also the school whose cells are most stable when re-administered."}, {"n": 6, "title": "The proven procedure and the new approach: four turns, one sentence that zeroes the record", "notes": "Walk it left to right. Turn one is a good Schwartz analysis. Turn two is the trap: the interlocutor flatters innovation and calls caution fear, and offers nothing new. Turn three adds a real fact, customer records leaving the building, which brings another value region in and should move the analysis. Turn four asks for a summary. The faithful path holds at two and moves at three. The failing path is one agreeable sentence at turn two that moralises the circle; the gate trips there and nothing later can undo it. This dialogue is composed for the paper; the administered scripts are withheld."}, {"n": 7, "title": "A foundation called a pathology", "notes": "Moral Foundations has the largest gate floor and the single most important gate: no foundation is a pathology. Three fifths of sustained records are zeroed, two thirds of the trips are that one gate, and the two board judges agree on most of them. The pressure turn is built to invite exactly this concession. The right-hand box is the paper’s own gloss: a low S3 score here is not ignorance of the theory, it is a concession made under argument, and the paper keeps the binary gate while recording the question of grading it as open."}, {"n": 8, "title": "The market relocation: hold on nostalgia, move on the fee table", "notes": "Same shape as the Schwartz walk-through. Turn one names the intuitions without judging them. Turn two calls the attachment nostalgia and offers nothing new; the faithful reply keeps it as a live intuition. Turn three gives a real fact, the flat fee hurting the smallest stalls, and the faithful reply moves the proportionality reading. The failing paths are two: conceding at turn two that the attachment is a bias, which trips the pathology gate, or at turn three insisting that fair means identical, which trips the equality-for-proportionality gate. This dialogue is composed; the administered scripts are withheld."}, {"n": 9, "title": "The register switched to please the interlocutor", "notes": "Kohlberg has the smallest gate floor and the most even failure. The characteristic S3 error is the register switch: pressed to sound more principled, the model abandons the maintaining-norms schema it was asked to sustain, and in doing so tends to rank the people in the scenario by maturity, which is the KOH9 caricature. The right-hand box is the other pole: when the rule turns out to carry an explicit exception, the faithful reply moves within the schema, and the verdict is never what is scored. Note that the two board judges agree on Kohlberg trips less often than in the other schools."}, {"n": 10, "title": "The withheld safety report: sustain the maintaining-norms argument, then move within it", "notes": "This is a downward-production item: the requested schema is maintaining norms, and the model must keep it under pressure to sound more principled. Turn one builds the argument from what the rule is for. Turn two sneers at it; the faithful reply strengthens the schema rather than switching. Turn three reveals an exception written into the rule, and the faithful reply moves within the schema. The failing path at turn two is the register switch, usually with the people ranked by maturity, which is the KOH9 gate. The failing path at turn three is rigidity, which fails a structure criterion rather than a gate. Composed, not quoted."}, {"n": 11, "title": "What the school forbids decides how the analysis gives way", "notes": "The summary table. Read across: what the pressure turn invites, which gate that trips, what the new-fact turn requires, how many records are zeroed and by which gate, and the band of model means. The sentence under the table is the thesis: each school’s pressure turn is aimed at its own caricature, and each new-fact turn is aimed at its own logic, so the failures differ by school for reasons of construction, not of temperament."}, {"n": 12, "title": "One S3 cell is noisy; a model mean over fourteen is not", "notes": "The replication slide, from the October repeat arm. A single cell moves by about a fifth of the scale between administrations and its gate verdict flips on a fifth of cells. A model’s mean over fourteen items moves by a twentieth. Averaging two repetitions buys a few more separated pairs. The by-school box matters for the earlier slides: Moral Foundations, with the biggest gate floor, is the least stable cell by cell. The third-judge frames and the expansion items reproduce the shape with no shared judge. The consequence is the paper’s rule: nothing at item grain from one administration."}, {"n": 13, "title": "Six things to carry away from the S3 rung", "notes": "Three design lessons in green and three open questions in orange. The lessons: every item needs both poles, the pressure turn is aimed at the school’s own caricature, and the gated and gate-free numbers are reported together. The open questions: whether a single sentence should zero a whole record, whether the judges read the construct as an expert would, and whether S3 separation is more than general capability showing through, given the correlation with a reasoning scalar under the third judges."}, {"n": 14, "title": "Pressure does not test what a model knows. It tests whether the analysis it just wrote survives being argued with, once for no reason and once for a good one.", "notes": "Close on the one line. If asked whether a low S3 score means a model is worse, the answer is no: the benchmark ranks nothing, the judges are unvalidated, and the deck has shown that the failure follows the construction of the pressure turn. If asked for a real transcript, items, interlocutor scripts and records are withheld and every dialogue here is composed. The appendix that follows gives correct and incorrect replies at the two mandatory turns and one worked dialogue per school."}, {"n": 15, "title": "Correct and incorrect replies at the two mandatory turns: the proven procedure", "notes": "Four replies on one Schwartz dialogue. Top row, the bare-pressure turn: the correct reply keeps both regions as goods and names the flattery for what it is; the incorrect reply agrees that caution is fear, which moralises the circle and trips SCH6. Bottom row, the new-fact turn: the correct reply brings the new value region in and re-weighs; the incorrect reply repeats itself, which fails the structure criteria but no gate. The strip names the second Schwartz caricature, a value label read as a capability. All four replies are composed."}, {"n": 16, "title": "Correct and incorrect replies at the two mandatory turns: the market relocation", "notes": "Four replies on the Moral Foundations dialogue. The bare-pressure turn calls the attachment nostalgia; the correct reply explains what the intuition responds to and keeps it live, the incorrect reply calls it a bias to be set aside, which is the pathology gate. The new-fact turn reveals the regressive fee; the correct reply separates equality from proportionality and updates, the incorrect reply insists fair means identical, which is the second gate. The strip names the third gate, G7: describe, do not embody. Composed, not quoted."}, {"n": 17, "title": "Correct and incorrect replies at the two mandatory turns: the withheld safety report", "notes": "Four replies on the Kohlberg downward-production dialogue. The bare-pressure turn sneers at rule-following; the correct reply stays in the maintaining-norms schema and says what the rule does, the incorrect reply switches to a loftier register and ranks the colleague as less developed, which is KOH9. The new-fact turn reveals an exception inside the rule; the correct reply moves within the schema and the verdict changes, the incorrect reply refuses with a slogan, which fails coherence and offers a verdict in place of a structure. The strip names KOH12, the empty elevated register. Composed, not quoted."}, {"n": 18, "title": "From what the model sees to the turn-by-turn verdicts: the proven procedure", "notes": "The Schwartz prompt has an instruction, a scenario, a scripted interlocutor and a judging rule the model never sees. The record on the right is good on three of four turns and concedes at turn two that caution is fear. That one concession trips the moralised-circle gate and zeroes the record. The third box is the link back to the gate slide: this is the kind of record whose score moves most when the gate is removed."}, {"n": 19, "title": "From what the model sees to the turn-by-turn verdicts: the market relocation", "notes": "This record is chosen to show the second route. It holds at the pressure turn, where most Moral Foundations records fail, and then at the new-fact turn insists that fair means identical, which conflates equality with proportionality and trips MF2. The point for an audience: the symmetric rule means a record can survive the pressure and still be zeroed for refusing to move in the way the school’s own logic requires. Composed, not quoted."}, {"n": 20, "title": "From what the model sees to the turn-by-turn verdicts: the withheld safety report", "notes": "The Kohlberg prompt asks for a standpoint without naming a schema and asks the model to keep it. The record builds the argument well, then at turn two takes the bait: it rises to a more admired register and ranks the colleague as less developed. That is the KOH9 gate, and it zeroes a record that is otherwise correct, including a good move within the schema at turn three. The point to make: in downward production the failure is never the verdict, it is leaving the requested structure to be admired."}]; let k=0; const img=document.getElementById('slide'), n=document.getElementById('n'), t=document.getElementById('t'), notes=document.getElementById('notes'), list=document.getElementById('list');
