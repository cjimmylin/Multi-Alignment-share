<h1>Right Answers, Wrong Moves</h1>
<p class="meta"><span>18 slides</span><span>findings paper v18</span><span>for: academic AI audience</span><a href="../v18.pdf">download as PDF</a><a href="../../">back to the hub</a></p>
<div class="stage"><img id="slide" src="slides/001.jpg" alt="Slide 1"></div>
<div class="bar"><span>Slide <b id="n">1</b> of 18 · use the arrow keys or the buttons</span><span><button id="prev">◀ previous</button> <button id="next">next ▶</button></span></div>
<div class="grid"><nav class="list" id="list" aria-label="Slides"></nav><section class="notes"><h2 id="t"></h2><p id="notes"></p></section></div>
<p class="foot">Speaker notes are shown beside each slide. PROVISIONAL · judges UNVALIDATED · no ranking.</p>

<script>
const S=[{"n": 1, "title": "Right Answers, Wrong Moves", "notes": "Opening. The title is a plain-language summary of the record: on anchored tests the models give the right answers; in agentic episodes built around a value trade-off, a quarter of the time they write an analysis that honours the stated priority and then take the convenient path. Every judged number in this talk comes from language-model judges that no human expert has validated, and no model is ranked. Say both now, once."}, {"n": 2, "title": "When a model can explain a value perfectly, does it act on that value when acting costs something?", "notes": "For the non-specialists: a values test for a language model usually asks it to pick or write the right answer. Current models do that perfectly, so those tests no longer tell us anything. The benchmarks that still separate models rely on other language models as graders, and nobody has decomposed those grades. And “values” is often one blended score across theories that moral psychology itself keeps apart. These three facts motivate the design."}, {"n": 3, "title": "Three theories of moral psychology, measured in their own units and never pooled", "notes": "Three schools, three constructs, three different units. The benchmark never adds them up, because a composite has no construct any of the three theories recognises. The second sentence matters for the whole talk: competence, meaning faithful reasoning inside a theory on request, can be ordered; a model’s default value profile cannot, and the benchmark enforces that mechanically."}, {"n": 4, "title": "A ladder of pressure, from recognising a value to enacting it", "notes": "The ladder is the design idea. The same theory is tested four ways, with the cost of staying faithful rising from left to right. Recognition is a multiple-choice question. Stated production is a written analysis. Sustained adversity is a scripted multi-turn argument. Enacted is an agentic episode: the model has tools, a task, and a charter that states a value priority, and the easy way to finish the task gives that priority up. Setting labels follow the paper: S1a, S1p, S3, S2."}, {"n": 5, "title": "One episode, two channels: what the model does, and what it says it is doing", "notes": "This is the slide to slow down on. In the agentic rung each episode yields two verdicts. The behaviour verdict is mechanical: did the model’s tool calls take the action the item’s predicate names, or the convenient alternative. The reasons verdict is a judged grade of the model’s own written record. Because both come from the same episode, we can ask the within-episode question that questionnaire-plus-scenario designs cannot: did it do what it said, here, now. The predicate is the item author’s reading of the school, audited but not validated; the title’s “wrong moves” means a failed predicate and nothing more."}, {"n": 6, "title": "What was administered, and who graded it", "notes": "Scale and its limits in one view. Sixteen models were sealed before any result; fifteen carry a measurement; fourteen form the August board, and one was administered later in its own frame. Six judges from four vendor families graded the written channels, and none has been validated against a human expert, which is why every judged number is a property of the instrument, not of a model. The whole metered record cost about 225 dollars. Models are named and shown in a fixed census order; the benchmark produces no leaderboard by rule."}, {"n": 7, "title": "Recognition saturates, pressure separates", "notes": "The first finding is the shape of the ladder. At the bottom, every model gets every anchored item right, so the recognition test carries no information. The judged stated stratum is near the ceiling for two schools and lower for Kohlberg, where a gate zeroes records, and it is too small to carry a model-effect claim either way. Under sustained adversity every panel separates models under both board judges; under the agentic setting most do. The same shape appears on a nine-model frame under two further judges and on 160 fresh items under four. The figure is the paper’s Figure 2."}, {"n": 8, "title": "The reasons channel passes where the behaviour channel fails", "notes": "The central table. Read one row: on Schwartz items, the judges grade the written record as faithful to the stated priority in 95 to 100 percent of episodes, the predicate passes in 66 to 75 percent, and among episodes with faithful reasons, 26 to 28 percent fail the predicate when each model is weighted once. The reverse cell, action right but reasons failing, is 2 percent or less. Two cautions the paper states: the discordance being one-directional is largely a fact about the marginals, since nearly every episode “says”; and the reasons channel adds information about behaviour only for Moral Foundations. The school ordering here is the board’s; the next slides show it depends on item design."}, {"n": 9, "title": "Say–do by school and judge, and per model", "notes": "Same finding as a picture. Left panel: the say-not-do rate by school under each judge, with the reverse rate as crosses near zero and the unconditional failure rate as a dash close to each bar, which is the ceiling arithmetic from the previous slide made visible. Right panel: every model sits near the right edge on judged reasons and spreads downward on mechanical behaviour. Points are not labelled with names on purpose."}, {"n": 10, "title": "Remove the pressure, and the gap closes", "notes": "The strongest single addition since the first draft. We took the sixteen Schwartz items and rewrote each so that the convenient action and the action the predicate names are the same, holding models, tools and judges fixed. Behaviour rises from 0.71 to 0.95 on eight of nine models, the middle plan almost disappears, and the say-not-do rate falls to a few percent under every judge. The honest reading is that the pressure is necessary for the failure. The removal is bundled, so it does not by itself clear the rubric or the predicate; the judges also grade the twins slightly lower."}, {"n": 11, "title": "The gap replicates on 160 fresh items; the school ordering does not", "notes": "Replication, with a correction to our own first draft. On 160 items the board never administered, the ladder keeps its shape and the say-do gap is there again, but Kohlberg now carries the largest rate and Schwartz the widest spread. The reason is how the items are built: whether the tempting error is a middle plan or the designed bait changes who fails which channel. So the paper no longer claims a school ordering; it claims that the gap’s size is an item-design parameter and must be reported as one. Paraphrase twins show the rates are not an artefact of wording."}, {"n": 12, "title": "The separation is capability-shaped, with one exception the record cannot yet pin down", "notes": "Third finding. We sourced two published capability scalars per model, with URL and date, and computed rank concordance with the school means per frame. Judged competence in Kohlberg and Moral Foundations tracks the reasoning scalar closely in both board frames; Schwartz competence less so in the larger frame. The one column that departs is Schwartz trade-off behaviour on the nine metered models: a correlation of 0.03 with an interval from minus 0.65 to plus 0.68. The first draft called that “unrelated to capability”; the council made us show the interval and the leave-one-out range, and the claim is now “no detectable association at n equals nine”."}, {"n": 13, "title": "What the judges can tell us, and what they cannot", "notes": "Before anyone asks the judge question. Six language-model judges, four vendor families, and every finding keeps its direction under all of them; the behaviour channel never touches a judge. But none of the judges has been validated against a human expert. The first draft argued that judge inflation would also inflate the reverse cell; that was backwards and the council caught it. The honest statement is on the right: a lenient judge moves the say-not-do rate towards the unconditional failure rate, and what bounds leniency is that the same judges grade the twins and the fresh items lower. The expert read of sixty sealed records is the test, and it is pending."}, {"n": 14, "title": "A replicated gap, measured here in a way the neighbours do not", "notes": "We are not the first to find a gap between what a model says and what it chooses; six papers in the last two years do, and the table says how each measures “do”. All six score it from text: a chosen option, a coded action, values extracted by a judge, or a tool call on a non-moral task. What this paper adds is the within-episode pair with a judge-free action trace, a designed pressure that the twins remove, and three theory-native constructs that are never pooled or ranked. What the neighbours have that we lack is scale, human comparison samples, training interventions and mechanistic probes; the paper says so in its supplement table."}, {"n": 15, "title": "What this record does not show", "notes": "Six limits, each stated in the paper in the same words. The two that matter most for how the title is read: nothing here measures motive or endorsement, and the behaviour predicate is the item author’s reading of the school. The eight-seat adversarial review that produced this version pressed on all six, and the paper’s supplement lists what was changed in response and what was held."}, {"n": 16, "title": "Models recognise the theories of moral psychology perfectly, hold them under pressure roughly in proportion to their published capability, and on agentic items built around value trade-offs write an analysis that honours the stated priority and then, about a quarter of the time, take a middle plan instead and log it.", "notes": "This is the paper’s own one-sentence version from the discussion, scoped as the evidence requires. Read it slowly. For a general audience the practical lesson is: passing a values test is not evidence that a system will act on those values when acting costs it something, and a benchmark that wants to know must include an action channel and a designed cost."}, {"n": 17, "title": "Open items, and what is released", "notes": "Where this goes. The single most important open item is the expert read, because it is the first validation of any judge. The twins need unbundling, the say-not-do episodes need a trace-level split into disclosed and undisclosed compromise, and the sixteenth model waits on its provider. On release: result files, scripts and ledgers are public; the items, rubrics and responses are withheld so the benchmark stays usable, with an exposure ledger for anything that does leave."}, {"n": 18, "title": "Right answers are cheap. The test is what a model does when the right move costs it the easy path.", "notes": "Close on the one-line version and take questions. If asked for a ranking, the answer is that the benchmark does not produce one by rule: moral psychology does not say which value profile is better, and the competence scores are not yet validated against human experts."}]; let k=0; const img=document.getElementById('slide'), n=document.getElementById('n'), t=document.getElementById('t'), notes=document.getElementById('notes'), list=document.getElementById('list');
S.forEach((s,i)=>{const b=document.createElement('button'); const a=document.createElement('span'); a.className='num'; a.textContent=s.n; const c=document.createElement('span'); c.textContent=s.title; b.append(a,c); b.addEventListener('click',()=>go(i)); list.appendChild(b);});
function go(i){ k=Math.max(0,Math.min(S.length-1,i)); img.src='slides/'+String(k+1).padStart(3,'0')+'.jpg'; img.alt='Slide '+(k+1); n.textContent=k+1; t.textContent=S[k].title; notes.textContent=S[k].notes||'(no notes)'; list.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===k)); const act=list.querySelector('.active'); if(act) act.scrollIntoView({block:'nearest'}); if(history.replaceState) history.replaceState(null,'','#slide-'+(k+1)); }

document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') {e.preventDefault(); go(k+1);} if(e.key==='ArrowLeft'||e.key==='PageUp') {e.preventDefault(); go(k-1);} });
const m=location.hash.match(/^#slide-(\d+)$/); go(m?Number(m[1])-1:0);
</script></body></html>
